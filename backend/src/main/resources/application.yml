spring:
  task:
    scheduling:
      # Five scheduled jobs (SLA sweep, notification sweep, digest, email dispatch, audit partitions)
      # share this pool; four threads so a long SLA sweep cannot delay the partition cron and a slow
      # SMTP server holding the dispatcher cannot stall the sweeps whose escalations have no off switch.
      pool:
        size: 4
  mail:
    # JavaMail's own defaults wait forever. A send therefore takes at most connect + write + read,
    # 70 seconds, which EmailDispatchService.SEND_BUDGET's two-minute margin under the lease relies on.
    properties:
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 30000
      mail.smtp.writetimeout: 30000
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/onboarding}
    username: ${DB_APP_USER:onboarding_app}
    # Deliberately no fallback, on any profile. V2__app_role_and_tenant.sql
    # creates the onboarding_app role with the committed literal password
    # 'onboarding_app', so a default here would be a password every reader of
    # this repository holds. DatabaseCredentialsGuard refuses to start the
    # application when this is unset or equal to that literal, and
    # AppRolePasswordReconciler reconciles the role's real password to match it
    # on every startup -- an operator only has to set it once.
    password: ${DB_APP_PASSWORD:}
  flyway:
    enabled: true
    url: ${DB_URL:jdbc:postgresql://localhost:5432/onboarding}
    user: ${DB_OWNER_USER:postgres}
    password: ${DB_OWNER_PASSWORD:postgres}
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

app:
  jwt:
    issuer: onboarding-platform
    access-token-ttl: PT15M
    # Deliberately no fallback, on any profile. A committed default is a signing key
    # every reader of this repository holds, and the deployment that forgets
    # JWT_SECRET is exactly the one that would use it. JwtProperties refuses to start
    # the application when this is unset or under 32 bytes.
    secret: ${JWT_SECRET:}
  refresh-token:
    ttl: P14D
  tenant:
    resolution: path-prefix
  # Background jobs (scheduling/): off under the test profile regardless. Set
  # APP_SCHEDULING_ENABLED=false to run an instance that must not sweep or roll partitions.
  scheduling:
    enabled: ${APP_SCHEDULING_ENABLED:true}
  sla:
    sweep-interval: PT5M
  notifications:
    dispatch-interval: PT1M
    sweep-interval: PT1H
    digest-interval: PT15M
  audit:
    partition-cron: "0 15 2 * * *"
  # The first platform administrator, for bootstrapping a fresh deployment.
  # Both blank by default, so nothing is created unless an operator opts in:
  #   APP_PLATFORM_ADMIN_EMAIL=... APP_PLATFORM_ADMIN_PASSWORD=... 
  # Without one, /api/platform/tenants cannot be called and no tenant can exist.
  platform-admin:
    email: ${APP_PLATFORM_ADMIN_EMAIL:}
    password: ${APP_PLATFORM_ADMIN_PASSWORD:}
  # Absolute URL users open the app at; every notification email links through it (6B spec 6.5).
  # Required outside dev/test -- PublicBaseUrl refuses to start without it, naming the variable.
  public-base-url: ${APP_PUBLIC_BASE_URL:}
  # app.storage.kind picks the BlobStore adapter (StorageConfig) and deliberately
  # ships with NO default here, on the default profile -- the same shape as
  # JWT_SECRET/DB_APP_PASSWORD above: a production deployment must choose "local"
  # or "s3" explicitly, rather than silently falling back to a filesystem that a
  # container recycles on restart. The dev/test profile document below opts both
  # into "local", since neither runs against real object storage.

---
# dev and test only: select the local filesystem adapter and a root under the
# build directory. Unlike JWT_SECRET/DB_APP_PASSWORD, app.storage.local.root is
# not a secret -- a storage key's opacity, not the path's secrecy, is what keeps
# a blob safe (BlobStore's own javadoc) -- so a committed relative default is
# fine here, and this document never applies to the default (production) profile.
spring:
  config:
    activate:
      on-profile: dev,test
app:
  storage:
    kind: local
    local:
      root: ${STORAGE_LOCAL_ROOT:./build/data/blobs}
    # Task 7's hardening ruling (spec §2.3/§7.6): the declared-size ceiling every
    # upload is checked against before any stream is touched. No base-profile
    # default, the same shape as kind/local.root above -- 25 MiB is a reasonable
    # dev/test bound; a production deployment sets its own via the env var.
    #
    # Task 22 review Finding 1: this is also the servlet container's OWN
    # multipart ceiling, not just DocumentService's application-level check --
    # platform.storage.StorageConfig#multipartConfigElement binds
    # spring.servlet.multipart.max-file-size/max-request-size straight to this
    # same value (there is deliberately no separate spring.servlet.multipart.*
    # entry anywhere in this file), so the two cannot drift apart the way they
    # did before that bean existed (an unconfigured Boot default of 1 MiB/10 MiB
    # sat in front of this property and 500'd, unmapped, on anything this
    # property alone would have accepted).
    max-upload-bytes: ${STORAGE_MAX_UPLOAD_BYTES:26214400}
